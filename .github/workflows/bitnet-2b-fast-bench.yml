name: BitNet 2B Logic A-B Fast Build

on:
  push:
    branches: [bitnet-2b-llf-bench]
    paths:
      - ".github/workflows/bitnet-2b-fast-bench.yml"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      MODEL_REV: a1f2f1c765812aa8af3f6eda4a313707064bba15
      MODEL_DIR: ${{ github.workspace }}/BitNet/models/BitNet-b1.58-2B-4T
      MODEL_FILE: ${{ github.workspace }}/BitNet/models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-18 git
          python3 -m pip install --upgrade --break-system-packages huggingface_hub hf_transfer

      - name: Fetch exact code and model
        run: |
          git clone --recursive --depth 1 https://github.com/microsoft/BitNet.git
          mkdir -p "$MODEL_DIR"
          hf download microsoft/bitnet-b1.58-2B-4T-gguf ggml-model-i2_s.gguf             --revision "$MODEL_REV" --local-dir "$MODEL_DIR"
          mkdir -p bitnet2b/results_quick
          lscpu > bitnet2b/results_quick/machine.txt
          sha256sum "$MODEL_FILE" > bitnet2b/results_quick/model_sha256.txt
          (cd BitNet && git rev-parse HEAD && git submodule status) > bitnet2b/results_quick/code_revisions.txt

      - name: Build exact official baseline
        run: |
          cd BitNet
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_C_COMPILER=clang-18             -DCMAKE_CXX_COMPILER=clang++-18             -DBITNET_X86_TL2=OFF             -DLLAMA_BUILD_TOOLS=ON             -DLLAMA_BUILD_EXAMPLES=ON             -DLLAMA_BUILD_COMMON=ON             -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --target llama-bench -j4
          cp build/bin/llama-bench build/bin/llama-bench.baseline

      - name: Baseline benchmark only
        run: |
          BitNet/build/bin/llama-bench.baseline             -m "$MODEL_FILE" -p 256 -n 64 -t 2 -r 2             | tee bitnet2b/results_quick/baseline.txt

      - name: Compile score-gap logic LUT attention
        run: |
          python3 bitnet2b/patch_logic_softmax.py BitNet
          cd BitNet
          cmake --build build --target llama-bench -j4
          cp build/bin/llama-bench build/bin/llama-bench.logic

      - name: Logic benchmark only
        run: |
          BitNet/build/bin/llama-bench.logic             -m "$MODEL_FILE" -p 256 -n 64 -t 2 -r 2             | tee bitnet2b/results_quick/logic.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bitnet2b-logic-speed-proof
          path: bitnet2b/results_quick/
